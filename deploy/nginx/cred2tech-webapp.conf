# Frontend vhost for PRODUCTION (EC2 primary and Hostinger standby use the SAME file).
# Install as /etc/nginx/sites-available/cred2tech-webapp (symlink into sites-enabled),
# then `nginx -t && systemctl reload nginx`. NOT applied by CI on purpose: it is a
# one-time server change reviewed by a human, because a mistake here affects the API
# vhost on the same box.
#
# Needs (owner/Phase 1 prerequisites, not created yet):
#   - wildcard certificate for *.cred2tech.com (DNS-01 on Route 53), paths below
#   - /opt/cred2tech/webapp/releases and /opt/cred2tech/webapp/current (created by deploy)
#
# nginx picks an exact server_name over a wildcard, so the existing prod.api vhost keeps
# winning for prod.api.cred2tech.com. Names that point elsewhere never reach this box.

# WebSocket upgrade helper for /api/socket.io
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $spa_cache {
    default                       "no-cache";
    ~^/assets/                    "public, max-age=31536000, immutable";
    ~^/(favicon|logo|icons?)      "public, max-age=86400";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.cred2tech.com *.cred2tech.com;
    # ACME http-01 is not used (DNS-01), so everything redirects.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Main app now; white-label subdomains (Phase 4) are served by the same block.
    server_name app.cred2tech.com *.cred2tech.com;

    ssl_certificate     /etc/letsencrypt/live/cred2tech.com-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cred2tech.com-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /opt/cred2tech/webapp/current;
    index index.html;

    # Security headers. CSP is deliberately NOT here yet: it needs an inventory of every
    # third-party script (Razorpay, Turnstile, fonts, push) and a Report-Only trial first,
    # otherwise it would break the live app. Tracked in docs/Whitelabel.md (Phase 1).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Never serve dotfiles or source maps from the release.
    location ~ /\.            { return 404; }
    location ~ \.map$         { return 404; }

    # Build id for the pipeline's parity check and the Deploy Portal. Never cached.
    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files /version.json =404;
    }

    # Route 53 health check target: proves nginx AND the API (which checks the DB) on
    # THIS server. A shared health check is attached to every failover record.
    location = /healthz {
        access_log off;
        proxy_pass http://127.0.0.1:5001/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # White-label organisation sites call THEIR OWN origin (/api on the same host), so a session never leaves the
    # org's host and no per-org CORS is needed (docs/Whitelabel.md 7.2 item 5, Phase 5). The API picks the org from the
    # Host header, so it must be passed through untouched. Safe for the main app host too: that host still uses its
    # build-time API address, this block is simply unused there.
    location /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO (/api/socket.io) needs the WebSocket upgrade; the provisioning live view is Server-Sent Events
        # and must not be buffered (the API also sends X-Accel-Buffering: no and a heartbeat every 20 s).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 75s;
        client_max_body_size 50m;   # parity with the API vhost (see the nginx upload ceiling note)
    }

    # SPA: real files first (hashed assets), everything else is index.html (client routing).
    location / {
        add_header Cache-Control $spa_cache always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}
