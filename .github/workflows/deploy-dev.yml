name: Deploy Dev

# Automatic — any push to any branch except main builds and deploys to
# dev.app.cred2tech.com (VPS-hosted, static nginx). Production (main) stays
# on Vercel untouched; this workflow never touches it and never runs for it.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy to dev"
        type: string
        required: true
      commit_sha:
        description: "Exact commit SHA to deploy (defaults to the tip of `branch`). Note: the workflow FILE itself still runs from whichever branch's copy was dispatched (always main here) — only the checked-out app code is pinned to this SHA."
        type: string
        required: false
      correlation_id:
        description: "Opaque id set by the Deploy Portal to correlate this run back to its own record; blank for ordinary manual runs."
        type: string
        required: false

run-name: Deploy Frontend Dev ${{ github.event.inputs.correlation_id }}

concurrency:
  group: deploy-webapp-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.commit_sha || github.event.inputs.branch || github.ref }}
          fetch-depth: ${{ github.event.inputs.commit_sha && 0 || 1 }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Set release metadata
        id: meta
        run: |
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          # `git rev-parse` reads the actually-checked-out commit — NOT
          # `github.sha`, which for a workflow_dispatch run reflects the
          # SHA of the dispatch `ref` (always `main` here per the Deploy
          # Portal's fixed dispatchRef), not the `commit_sha` input that
          # was actually checked out above.
          echo "release_ts=$(date +%Y%m%d_%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write version.json
        # Lets the Deploy Portal read "what's actually live on
        # dev.app.cred2tech.com" the same way it reads the backend's
        # /health — via a plain GET, no SSH/API polling needed.
        run: |
          printf '{"commit":"%s","branch":"%s","release_ts":"%s"}\n' \
            "${{ steps.meta.outputs.git_commit }}" "${{ steps.meta.outputs.branch }}" "${{ steps.meta.outputs.release_ts }}" \
            > dist/version.json

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (same VPS as the backend repo's workflows) — see
          # Cred2Tech/.github/workflows/deploy-prod.yml for why this is
          # pinned instead of scanned at runtime (connection-rate flake).
          printf '%s\n' "187.127.150.119 ssh-rsa " >> ~/.ssh/known_hosts
          printf '%s\n' "187.127.150.119 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBCXYdZ7LNWwSouKUAO7rWhT8YyAvU2a86Yt8o9fEvjkmt+8dvXoiIcHHgAWKteWQiiZ8XErhO8uOaDAfEFnWEv8=" >> ~/.ssh/known_hosts
          printf '%s\n' "187.127.150.119 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgCzT99SI9ryEH9PuMh1tCkSDOGMaYjFKmVqgApHAbZ" >> ~/.ssh/known_hosts

      - name: Create remote release directory
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p /opt/cred2tech/webapp-dev/releases/${{ steps.meta.outputs.release_ts }}"

      - name: Rsync build output
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/cred2tech/webapp-dev/releases/${{ steps.meta.outputs.release_ts }}/"

      - name: Switch symlink + cleanup old releases
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" bash -s <<EOF
            set -e
            ln -sfn /opt/cred2tech/webapp-dev/releases/${{ steps.meta.outputs.release_ts }} /opt/cred2tech/webapp-dev/current
            echo "Live: branch=${{ steps.meta.outputs.branch }} release=${{ steps.meta.outputs.release_ts }} commit=${{ steps.meta.outputs.git_commit }}"
            cd /opt/cred2tech/webapp-dev/releases
            # Best-effort: an old release dir this deploy user doesn't own
            # (e.g. left behind by a one-off manual/root deploy) must not
            # fail the whole job — the site's already live at this point.
            ls -dt */ 2>/dev/null | tail -n +6 | xargs -r rm -rf 2>&1 | tee /tmp/cleanup.log || true
            if [ -s /tmp/cleanup.log ]; then
              echo "::warning::Old release cleanup had errors (see below) — site is live, but disk cleanup needs a look:"
              cat /tmp/cleanup.log
            fi
            echo "Cleanup done. Retained last 5 releases."
          EOF

      - name: Smoke test
        run: |
          # Runs on the VPS itself, not the GH runner. --resolve pins the
          # real hostname to localhost for both the TCP connection and TLS
          # SNI (nginx picks the vhost/cert off SNI, not the Host header, so
          # a Host-header-only override on an IP/localhost URL would hit the
          # wrong cert's default vhost).
          CODE=$(ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "curl -s -o /dev/null -w '%{http_code}' --resolve dev.app.cred2tech.com:443:127.0.0.1 https://dev.app.cred2tech.com/")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "::error::Smoke test failed: expected 200, got $CODE"; exit 1; }

      - name: Clean up local key
        if: always()
        run: rm -f ~/.ssh/deploy_key
